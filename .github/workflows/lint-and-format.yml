name: Auto Fix & Lint (Ruff + Black)

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'uv.lock'

permissions:
  contents: write   # Important: Allows the workflow to commit changes

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # Needed to push changes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff + Black
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Black (Auto Format)
        run: black .

      - name: Run Ruff (Auto Fix + Format)
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected - will commit"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push fixes (if any)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: auto-fix code with Black + Ruff"
          git push